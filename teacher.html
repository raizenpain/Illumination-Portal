<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dungeon Master | HCDC Illumination Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="teacher-page">

  <div class="teacher-container">

    <div class="teacher-header">
      <div class="teacher-crest">
        <span class="teacher-crest-icon">🗝️</span>
        <div>
          <span class="info-label">Illumination Portal</span>
          <h1>Dungeon Master</h1>
          <p id="teacherInfo">HCDC Puzzle Master</p>
        </div>
      </div>
      <button class="dm-back-btn" onclick="window.location.href='dashboard.html'">&larr; Dashboard</button>
    </div>

    <div class="teacher-panel">
      <h2>🗝️ Relic Release</h2>
      <p>Choose a chapter, then unseal each relic so seekers can claim it.</p>

      <div id="puzzleTabs" class="puzzle-tabs"></div>
      <div id="releaseButtons"></div>
    </div>

    <div class="teacher-panel" style="margin-top: 24px;">
      <h2>📜 The Roster</h2>
      <p id="rosterSubtitle">Choose a teacher to begin.</p>

      <div id="teacherListView" class="roster-nav-grid"></div>

      <div id="classListView" class="hidden">
        <button type="button" class="dm-back-btn roster-back-btn" id="backToTeachers">&larr; Back to Teachers</button>
        <div id="classListGrid" class="roster-nav-grid"></div>
      </div>

      <div id="rosterView" class="hidden">
        <div class="roster-view-actions">
          <button type="button" class="dm-back-btn roster-back-btn" id="backToClasses">&larr; Back to Classes</button>
          <button type="button" class="submit-quiz-btn roster-export-btn" id="exportCsvBtn">⬇ Export CSV</button>
        </div>

        <table id="studentTable" class="student-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Puzzle 1</th>
              <th>Puzzle 2</th>
              <th>Puzzle 3</th>
              <th>Rank</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

  </div>

  <script type="module" src="teacher.js"></script>

</body>
</html>
