<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Mustard Seed | HCDC Illumination Portal</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="clickSound.js"></script>
<script type="module" src="legendaryCountdown.js"></script>
<style>
  :root {
    --msd-night: #0b1310;
    --msd-gold: #e8c27a;
    --msd-cream: #f3ead2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--msd-night); color: var(--msd-cream); font-family: 'Segoe UI', sans-serif; }
  a { color: inherit; }

  #backBtn {
    position: fixed; top: 14px; left: 14px; z-index: 40;
    padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.25);
    background: rgba(0,0,0,0.4); color: var(--msd-cream); text-decoration: none; font-size: 13px;
  }

  #msdRoot { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 70px 16px 40px; }
  .msd-loading { font-style: italic; color: rgba(243,234,210,0.7); }

  .msd-intro, .msd-garden {
    width: min(480px, 100%);
    background: linear-gradient(180deg, #14241c, #0d1a14);
    border: 1px solid rgba(232,194,122,0.3);
    border-radius: 20px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .msd-intro h1, .msd-garden h1, .msd-stage-title { font-size: 24px; margin: 0 0 12px; color: var(--msd-gold); }
  .msd-intro-icon { margin-bottom: 14px; }
  .msd-intro-body { font-size: 14.5px; line-height: 1.6; color: rgba(243,234,210,0.85); margin: 0 0 18px; }
  .msd-intro-list { text-align: left; font-size: 13.5px; line-height: 1.9; color: rgba(243,234,210,0.75); margin: 0 0 22px; padding-left: 20px; }

  .msd-btn {
    padding: 11px 22px; border-radius: 22px; border: 1px solid rgba(232,194,122,0.5);
    background: rgba(232,194,122,0.12); color: var(--msd-gold); font-size: 14px; cursor: pointer;
    text-decoration: none; display: inline-block;
  }
  .msd-btn:disabled { opacity: 0.45; cursor: default; }
  .msd-btn-primary { background: linear-gradient(135deg,#f3d09a,#e2a34b); color: #2a1c08; border: none; font-weight: 700; }
  .msd-btn-claim {
    display: block; width: 100%; margin-top: 18px;
    background: linear-gradient(135deg,#ffd97a,#e2a34b); color: #2a1c08; border: none; font-weight: 700;
    animation: msd-pulse 2.2s ease-in-out infinite;
  }
  @keyframes msd-pulse {
    0%, 100% { box-shadow: 0 0 0 rgba(232,194,122,0.4); }
    50% { box-shadow: 0 0 26px rgba(232,194,122,0.6); }
  }

  .msd-stage-stage { position: relative; width: 180px; height: 180px; margin: 0 auto 6px; display: flex; align-items: flex-end; justify-content: center; }
  .msd-glow {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle, rgba(111,174,106,0.35), transparent 70%);
    filter: blur(4px); animation: msd-sway 5s ease-in-out infinite;
  }
  .msd-glow-stage-0 { background: radial-gradient(circle, rgba(150,110,60,0.3), transparent 70%); }
  .msd-glow-stage-1, .msd-glow-stage-2 { background: radial-gradient(circle, rgba(111,174,106,0.35), transparent 70%); }
  .msd-glow-stage-3, .msd-glow-stage-4 { background: radial-gradient(circle, rgba(120,190,110,0.4), transparent 70%); }
  .msd-glow-stage-5 { background: radial-gradient(circle, rgba(230,150,190,0.4), transparent 70%); }
  .msd-glow-stage-6, .msd-glow-stage-7 { background: radial-gradient(circle, rgba(232,194,122,0.5), transparent 70%); }
  @keyframes msd-sway {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .msd-mound {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 130px; height: 46px; border-radius: 50% 50% 46% 54% / 100% 100% 40% 40%;
    background: linear-gradient(180deg, #6b4a2c, #3f2f1c);
    box-shadow: 0 8px 16px rgba(0,0,0,0.4);
  }
  .msd-stage-icon {
    position: relative; font-size: 76px; line-height: 1; margin-bottom: 34px;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.4));
    animation: msd-bob 3.2s ease-in-out infinite;
  }
  @keyframes msd-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .msd-stage-hint { font-size: 13.5px; font-style: italic; color: rgba(243,234,210,0.7); margin: 0 0 20px; }

  .msd-stats { margin-bottom: 20px; }
  .msd-stat-label { display: block; font-size: 12px; color: rgba(243,234,210,0.6); margin-bottom: 4px; text-align: left; }
  .msd-bar { height: 8px; border-radius: 6px; background: rgba(255,255,255,0.1); overflow: hidden; }
  .msd-bar-fill { height: 100%; background: linear-gradient(90deg,#6fae6a,#9fd39a); }
  .msd-stat-row { display: flex; justify-content: space-between; font-size: 12.5px; color: rgba(243,234,210,0.75); margin-top: 10px; }
  .msd-next { font-size: 12.5px; color: var(--msd-gold); font-style: italic; margin: 8px 0 0; }

  .msd-actions { display: flex; gap: 10px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }

  .msd-reflection { margin-bottom: 6px; text-align: left; }
  .msd-reflection-prompt { display: block; font-size: 13px; font-style: italic; color: rgba(243,234,210,0.8); margin-bottom: 8px; }
  .msd-reflection-input {
    width: 100%; min-height: 70px; border-radius: 10px; border: 1px solid rgba(232,194,122,0.3);
    background: rgba(255,255,255,0.05); color: var(--msd-cream); font-family: inherit; font-size: 13.5px;
    padding: 10px; resize: vertical; margin-bottom: 10px;
  }
  .msd-reflection-done { text-align: center; font-size: 13.5px; color: rgba(243,234,210,0.75); }

  .msd-toast { margin: 14px 0 0; font-size: 13px; color: var(--msd-gold); }

  .msd-completed .msd-stage-icon { font-size: 64px; margin-bottom: 10px; animation: none; }

  .msd-debug {
    margin-top: 22px; padding-top: 16px; border-top: 1px dashed rgba(232,194,122,0.3);
    text-align: center;
  }
  .msd-debug-label { margin: 0 0 10px; font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(243,234,210,0.55); }
  .msd-debug-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  .msd-unlock-overlay {
    position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
    background: rgba(3,10,7,0.86); animation: msd-fade-in 0.3s ease; padding: 20px;
  }
  .msd-unlock-card {
    position: relative; width: min(380px, 100%); text-align: center;
    background: linear-gradient(180deg,#14241c,#0d1a14); border: 1px solid rgba(232,194,122,0.5);
    border-radius: 20px; padding: 34px 26px; overflow: hidden;
  }
  .msd-unlock-glow {
    position: absolute; top: -40px; left: 50%; transform: translateX(-50%);
    width: 220px; height: 220px; border-radius: 50%;
    background: radial-gradient(circle, rgba(232,194,122,0.35), transparent 70%);
    animation: msd-pulse-glow 2.4s ease-in-out infinite;
  }
  @keyframes msd-pulse-glow {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
  .msd-unlock-icon { position: relative; font-size: 54px; margin-bottom: 10px; }
  .msd-unlock-card h2 { position: relative; margin: 0 0 8px; color: var(--msd-gold); font-size: 21px; }
  .msd-unlock-card p { position: relative; font-size: 14px; color: rgba(243,234,210,0.85); line-height: 1.6; margin: 0 0 20px; }
  @keyframes msd-fade-in { from { opacity: 0; } to { opacity: 1; } }

  .msd-fireflies { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .msd-firefly {
    position: absolute; bottom: 0; left: var(--x); width: 5px; height: 5px; border-radius: 50%;
    background: #ffe9a8; box-shadow: 0 0 8px 2px rgba(255,233,168,0.8);
    animation: msd-firefly-rise var(--duration) ease-out var(--delay) forwards;
    opacity: 0;
  }
  @keyframes msd-firefly-rise {
    0% { opacity: 0; transform: translate(0,0); }
    15% { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--drift), -220px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .msd-glow, .msd-stage-icon, .msd-btn-claim, .msd-unlock-glow, .msd-firefly { animation: none; }
  }

  @media (max-width: 480px) {
    .msd-intro, .msd-garden { padding: 26px 18px; border-radius: 16px; }
    .msd-stage-icon { font-size: 60px; }
    #msdRoot { padding-top: 60px; }
  }
</style>
</head>
<body>
<a id="backBtn" href="dashboard.html">← Dashboard</a>
<div id="msdRoot"></div>
<script type="module" src="mustardSeedGame.js"></script>
</body>
</html>
