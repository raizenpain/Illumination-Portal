<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="clickSound.js"></script>
</head>
<body class="puzzle-page">

  <div class="puzzle-card-wrapper quest-card">
    <div class="quest-crest">
      <img src="assets/hcdc-logo.png" alt="HCDC Logo" class="puzzle-logo">
    </div>

    <h1 id="puzzleTitle">Puzzle</h1>
    <p class="puzzle-subtitle" id="puzzleSubtitle"></p>
    <p id="studentInfo" class="puzzle-student-info"></p>

    <div id="board" class="board"></div>

    <div class="code-entry">
      <input type="text" id="pieceCode" class="code-input" placeholder="Enter piece code" autocomplete="off">
      <button id="submitCodeBtn" class="submit-code-btn">Unlock Piece</button>
    </div>

    <p id="status" class="puzzle-status"></p>

    <button class="back-btn" onclick="window.location.href='dashboard.html'">Back to Dashboard</button>
  </div>

  <div id="achievementPopup" class="achievement-popup hidden">
    <div class="achievement-box">
      <div class="achievement-icon">🏅</div>
      <h2 id="achievementHeading">Achievement Unlocked!</h2>
      <h3 id="achievementTitle">Title</h3>
      <p id="achievementText">Description</p>
    </div>
  </div>

  <script type="module" src="app.js"></script>

</body>
</html>
