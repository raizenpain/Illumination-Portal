<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Illumination — a 2D adventure of light and discovery</title>
<style>
  :root{
    --ink:#050b11;
    --night:#0b1721;
    --teal:#1b3a41;
    --ember:#e2703a;
    --amber:#f3b45f;
    --cream:#f6e6c2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--ink);overflow:hidden;
    font-family:"Trebuchet MS","Gill Sans","Avenir Next",system-ui,sans-serif;color:var(--cream)}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{max-width:100%;max-height:100%;width:auto;height:auto;display:block;
    image-rendering:auto;touch-action:none;
    box-shadow:0 0 120px rgba(226,112,58,.10)}
  /* touch controls */
  #pad{position:fixed;inset:auto 0 0 0;display:none;justify-content:space-between;
    padding:16px;pointer-events:none;gap:12px}
  #pad.on{display:flex}
  .grp{display:flex;gap:12px;pointer-events:auto}
  .btn{width:66px;height:66px;border-radius:50%;border:1px solid rgba(246,230,194,.28);
    background:rgba(11,23,33,.55);backdrop-filter:blur(4px);color:var(--cream);
    font-size:20px;letter-spacing:1px;display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  .btn:active{background:rgba(243,180,95,.28)}
  .btn.wide{width:84px}
  @media (hover:hover){#pad{display:none !important}}
  @media (prefers-reduced-motion:reduce){canvas{box-shadow:none}}

  /* ---------- portal integration ---------- */
  #backBtn{position:fixed;top:14px;left:14px;z-index:40;padding:8px 14px;border-radius:20px;
    border:1px solid rgba(246,230,194,.25);background:rgba(5,11,17,.55);backdrop-filter:blur(4px);
    color:var(--cream);font-size:13px;text-decoration:none;letter-spacing:.02em;
    display:flex;align-items:center;gap:6px}
  #backBtn:active{background:rgba(243,180,95,.22)}

  #gate{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
    text-align:center;background:radial-gradient(ellipse at 50% 40%,var(--deep,#0f2530) 0%,var(--ink) 72%);
    padding:32px}
  #gate.on{display:flex}
  #gate .box{max-width:480px}
  #gate h2{font-size:26px;color:var(--amber);margin-bottom:12px;letter-spacing:.02em}
  #gate p{font-size:15px;color:rgba(246,230,194,.75);line-height:1.6}

  #reflect{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    background:rgba(3,7,11,.72);backdrop-filter:blur(2px);padding:24px}
  #reflect.on{display:flex}
  #reflect .box{max-width:520px;max-height:80vh;overflow-y:auto;background:linear-gradient(180deg,#132a34,#0b1c24);
    border:1px solid rgba(243,180,95,.35);border-radius:16px;padding:28px 26px;
    box-shadow:0 20px 60px rgba(0,0,0,.5)}
  #reflect .kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);opacity:.85}
  #reflect h3{font-size:20px;color:var(--cream);margin:8px 0 14px;line-height:1.35}
  #reflect .body{font-size:14.5px;color:rgba(246,230,194,.88);line-height:1.7;white-space:pre-line}
  #reflect .reward-banner{margin-top:16px;padding:12px 14px;border-radius:10px;
    background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.35);
    color:#c9f5d4;font-size:14px;font-weight:600;text-align:center}
  #reflect .reward-banner.hidden{display:none}
  #reflect button{margin-top:20px;padding:9px 22px;border-radius:20px;border:1px solid rgba(243,180,95,.5);
    background:rgba(243,180,95,.14);color:var(--amber);font-size:13.5px;cursor:pointer;
    font-variant-numeric:tabular-nums}
  #reflect button:active{background:rgba(243,180,95,.3)}
  #reflect button:disabled{cursor:default;opacity:.55;border-color:rgba(243,180,95,.28);background:transparent}
</style>
</head>
<body>
<a id="backBtn" href="dashboard.html">← Dashboard</a>

<div id="gate">
  <div class="box">
    <h2 id="gateHeading">The path is not yet open.</h2>
    <p id="gateText"></p>
  </div>
</div>

<div id="reflect">
  <div class="box">
    <div class="kicker" id="reflectKicker">Along the Way</div>
    <h3 id="reflectHeading"></h3>
    <div class="body" id="reflectBody"></div>
    <div class="reward-banner hidden" id="reflectReward"></div>
    <button id="reflectClose" type="button">Continue</button>
  </div>
</div>

<div id="wrap"><canvas id="c" width="960" height="600"></canvas></div>
<div id="pad">
  <div class="grp">
    <div class="btn" data-k="left">◀</div>
    <div class="btn" data-k="right">▶</div>
  </div>
  <div class="grp">
    <div class="btn wide" data-k="flare">✦</div>
    <div class="btn wide" data-k="jump">▲</div>
  </div>
</div>

<script>window.__gamePaused = true;</script>
<script type="module">
import { db, doc, getDoc, runTransaction, increment, arrayUnion } from './firebase.js';
import { requireLogin } from './auth.js';
import { SIDE_QUESTS, getQuestStatus, getFeaturedQuest, sideQuestBadgeId } from './sideQuests.js';
import { logActivity } from './activity.js';

const { email, name } = requireLogin();

const params = new URLSearchParams(window.location.search);
const requestedId = params.get('quest');
const quest = requestedId ? SIDE_QUESTS[requestedId] : getFeaturedQuest();

const gateEl = document.getElementById('gate');
const gateHeadingEl = document.getElementById('gateHeading');
const gateTextEl = document.getElementById('gateText');
const reflectEl = document.getElementById('reflect');
const reflectKickerEl = document.getElementById('reflectKicker');
const reflectHeadingEl = document.getElementById('reflectHeading');
const reflectBodyEl = document.getElementById('reflectBody');
const reflectRewardEl = document.getElementById('reflectReward');
const reflectCloseBtn = document.getElementById('reflectClose');

function formatDate(iso) {
  return new Date(iso).toLocaleString('en-PH', { month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function showGate(heading, text) {
  gateHeadingEl.textContent = heading;
  gateTextEl.textContent = text;
  gateEl.classList.add('on');
}

// Reflections can't be skipped -- they hold the screen for a fixed
// read time, then dismiss themselves. No click can close them early.
let reflectTimer = null;
function showReflection(kicker, heading, text, durationMs, rewardText) {
  window.__gamePaused = true;
  reflectKickerEl.textContent = kicker;
  reflectHeadingEl.textContent = heading;
  reflectBodyEl.textContent = text;
  if (rewardText) {
    reflectRewardEl.textContent = rewardText;
    reflectRewardEl.classList.remove('hidden');
  } else {
    reflectRewardEl.classList.add('hidden');
  }
  reflectEl.classList.add('on');

  reflectCloseBtn.disabled = true;
  const deadline = Date.now() + durationMs;
  clearInterval(reflectTimer);
  const tick = () => {
    const remain = Math.max(0, deadline - Date.now());
    const secs = Math.ceil(remain / 1000);
    reflectCloseBtn.textContent = remain > 0 ? `Reading… ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}` : 'Continue';
    if (remain <= 0) {
      clearInterval(reflectTimer);
      reflectEl.classList.remove('on');
      window.__gamePaused = false;
    }
  };
  tick();
  reflectTimer = setInterval(tick, 250);
}

let studentState = { shardsCompleted: false, beaconCompleted: false, completed: false };

async function grantOnce(flagName, tickets) {
  const studentRef = doc(db, 'students', email);
  let granted = false;
  let firstEverCompletion = false;
  try {
    await runTransaction(db, async (tx) => {
      const snap = await tx.get(studentRef);
      const data = snap.data() || {};
      const current = (data.sideQuests || {})[quest.id] || {};
      if (current[flagName]) return; // already granted -- replay, no-op

      const updates = { [`sideQuests.${quest.id}.${flagName}`]: true };
      Object.entries(tickets).forEach(([type, qty]) => { updates[`tickets.${type}`] = increment(qty); });

      if (flagName === 'beaconCompleted' && !current.completed) {
        firstEverCompletion = true;
        updates[`sideQuests.${quest.id}.completed`] = true;
        updates[`sideQuests.${quest.id}.completedAt`] = new Date().toISOString();
        updates.achievements = arrayUnion(sideQuestBadgeId(quest.id));
      }

      tx.update(studentRef, updates);
      granted = true;
    });
  } catch (err) {
    console.error(`Failed to grant ${flagName}:`, err);
  }

  if (granted) {
    studentState[flagName] = true;
    if (firstEverCompletion) {
      studentState.completed = true;
      logActivity({ email, name, type: 'sidequest', title: `Completed the "${quest.title}" side quest`, icon: '🏮' });
    }
  }
}

function rewardLine(tickets, isFullQuest) {
  const qty = Object.values(tickets)[0]; // every ticket type gets the same amount
  return isFullQuest
    ? `🎉 Congratulations! +${qty} of every ticket type — quest complete!`
    : `🎉 Congratulations! +${qty} of every ticket type!`;
}

window.onShardPicked = (index) => {
  const r = quest.shardReflections[index];
  if (!r) return;
  const isLastShard = index === quest.shardReflections.length - 1;
  const isNewGrant = isLastShard && !studentState.shardsCompleted;
  if (isLastShard) grantOnce('shardsCompleted', quest.shardsReward);
  showReflection('Along the Way', r.verse, r.note, 60000, isNewGrant ? rewardLine(quest.shardsReward, false) : null);
};

window.onBeaconReached = () => {
  const isNewGrant = !studentState.beaconCompleted;
  grantOnce('beaconCompleted', quest.beaconReward);
  showReflection('The Beacon', quest.beaconReflection.heading, quest.beaconReflection.text, 120000, isNewGrant ? rewardLine(quest.beaconReward, true) : null);
};

async function init() {
  if (!quest || quest.kind !== 'illumination') {
    showGate('No Side Quest Right Now', 'Check back soon — a new one is on the way.');
    return;
  }

  const status = getQuestStatus(quest);

  let data = {};
  try {
    const snap = await getDoc(doc(db, 'students', email));
    data = snap.exists() ? snap.data() : {};
  } catch (err) {
    console.error('Failed to load student record:', err);
  }
  const saved = (data.sideQuests || {})[quest.id];
  if (saved) {
    studentState = {
      shardsCompleted: !!saved.shardsCompleted,
      beaconCompleted: !!saved.beaconCompleted,
      completed: !!saved.completed
    };
  }

  if (status === 'upcoming') {
    showGate('The Path Is Not Yet Open', `The climb opens ${formatDate(quest.startsAt)}. Come back then!`);
    return;
  }

  if (status === 'ended' && !studentState.completed) {
    showGate('The Path Has Closed', 'This Side Quest has ended. Watch the dashboard for the next one!');
    return;
  }

  window.__gamePaused = false;
}

init();
</script>

function beep(f,d,type='triangle',vol=.06,slide=0){
  if(!SND.ac||SND.muted)return;
  const t=SND.ac.currentTime, o=SND.ac.createOscillator(), g=SND.ac.createGain();

  flies=FLIES.map(f=>({x:f[0],y:f[1],on:true,ph:Math.random()*6,cool:0}));
  player={x:210,y:1830,w:20,h:32,vx:0,vy:0,ground:false,face:1,coyote:0,buf:0,anim:0,dead:0};
  cat={x:150,y:1848,face:1,trail:[]};
  cam={x:0,y:WORLD.h-H};
  checkpoint={x:210,y:1830};
  timer=0; fade=0; msg={text:'Hold the lantern high. The dark hides the road.',life:280};
  BEACON.lit=false;
}
function startGame(){ if(state!=='play'){ reset(); state='play'; } }

/* ---------- lantern ---------- */
const L={x:0,y:0,r:150,oil:100,flare:0};
function lightRadius(){
  const got=shards.filter(s=>s.got).length;
  let r=140+got*16;
  if(L.oil<=0) r=64;
  return r*(1+L.flare*0.95);
}

/* ---------- helpers ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function distToRect(px,py,r){
  const dx=Math.max(r.x-px,0,px-(r.x+r.w));
  const dy=Math.max(r.y-py,0,py-(r.y+r.h));
  return Math.hypot(dx,dy);
}
function litness(p){
  const R=lightRadius();
  let v=1-clamp(distToRect(L.x,L.y,p)/R,0,1);
  for(const l of lamps){ if(!l.lit) continue;
    v=Math.max(v,1-clamp(distToRect(l.x,l.y-46,p)/160,0,1)); }
  return v;
}
const solidFor=p=> p.kind==='p' || p.lit>0.42;

/* ---------- update ---------- */
function update(){
  if(window.__gamePaused) return;
  t++;
  if(state!=='play'){ // idle lantern for title art
    L.x=480+Math.sin(t/70)*30; L.y=330; return;
  }
  timer+=1/60;
  const p=player;

  // lantern follows the raised hand
  L.x=lerp(L.x,p.x+p.w/2+p.face*(boyOK?12.5:16),.35);
  L.y=lerp(L.y,p.y+(boyOK?-3:6),.35);

  // flare
  const wantFlare=K.flare&&L.oil>0;
  L.flare=lerp(L.flare, wantFlare?1:0, .12);
  L.oil-= wantFlare? 0.26 : 0.022;
  L.oil=clamp(L.oil,0,100);

  // recompute lighting on platforms
  for(const pl of plats) pl.lit=lerp(pl.lit,litness(pl),.4);

  if(p.dead>0){
    p.dead--;
    if(p.dead===0){ p.x=checkpoint.x; p.y=checkpoint.y; p.vx=p.vy=0; fade=1; }
    return;
  }

  // horizontal
  const acc=p.ground?0.9:0.55;
  if(K.left){p.vx-=acc;p.face=-1;}
  if(K.right){p.vx+=acc;p.face=1;}
  if(!K.left&&!K.right) p.vx*= p.ground?0.80:0.93;
  p.vx=clamp(p.vx,-4.7,4.7);

  // jump
  if(K.jump) p.buf=9; else p.buf=Math.max(0,p.buf-1);
  if(p.buf&&p.coyote){ p.vy=-13.1; p.ground=false; p.coyote=0; p.buf=0; sfx.jump(); }
  if(!K.jump&&p.vy<-5) p.vy=-5;   // variable jump height
  p.vy=Math.min(p.vy+0.68,17);

  // collide
  const solids=plats.filter(solidFor);
  p.x+=p.vx;
  for(const s of solids){
    if(p.x<s.x+s.w&&p.x+p.w>s.x&&p.y<s.y+s.h&&p.y+p.h>s.y){
      if(p.vx>0) p.x=s.x-p.w; else if(p.vx<0) p.x=s.x+s.w;
      p.vx=0;
    }
  }
  const wasGround=p.ground;
  p.ground=false;
  p.y+=p.vy;
  for(const s of solids){
    if(p.x<s.x+s.w&&p.x+p.w>s.x&&p.y<s.y+s.h&&p.y+p.h>s.y){
      if(p.vy>0){ p.y=s.y-p.h; p.ground=true; if(!wasGround&&p.vy>6) sfx.land(); }
      else if(p.vy<0) p.y=s.y+s.h;
      p.vy=0;
    }
  }
  p.coyote=p.ground?9:Math.max(0,p.coyote-1);
  p.x=clamp(p.x,0,WORLD.w-p.w);
  p.anim+=Math.abs(p.vx)*0.14;

  // fell too far below the last lit lamp
  if(p.y>checkpoint.y+430 || p.y>WORLD.h){
    p.dead=42; sfx.fall(); msg={text:'The dark carries you back to the last lamp.',life:180};
  }

  // pickups
  for(const s of shards){ if(!s.got&&Math.hypot(s.x-(p.x+10),s.y-(p.y+16))<34){
    s.got=true; sfx.shard();
    const n=shards.filter(a=>a.got).length;
    msg={text:`Light shard ${n} of 6 — your lantern reaches further.`,life:200};
    window.onShardPicked && window.onShardPicked(shards.indexOf(s));
    if(n===6){ window.onShardsComplete && window.onShardsComplete(); }
  }}
  for(const l of lamps){ if(!l.lit&&Math.hypot(l.x-(p.x+10),l.y-24-(p.y+16))<60){
    l.lit=true; L.oil=100; checkpoint={x:l.x-10,y:l.y-40}; sfx.lamp();
    msg={text:'Lamp lit. Oil refilled.',life:150};
  }}
  for(const f of flies){
    if(f.cool>0){f.cool--; if(f.cool===0)f.on=true;}
    if(f.on&&Math.hypot(f.x-(p.x+10),f.y-(p.y+16))<30){ f.on=false; f.cool=520; L.oil=clamp(L.oil+28,0,100); sfx.oil(); }
  }
  // beacon
  if(Math.hypot(BEACON.x-(p.x+10),BEACON.y-20-(p.y+16))<58){
    BEACON.lit=true; state='win'; sfx.win();
    window.onBeaconReached && window.onBeaconReached();
  }

  // cat trail
  cat.trail.push({x:p.x,y:p.y});
  if(cat.trail.length>46) cat.trail.shift();
  const tgt=cat.trail[0];
  if(Math.hypot(tgt.x-cat.x,tgt.y-cat.y)>430){ cat.x=tgt.x; cat.y=tgt.y; cat.trail.length=0; }
  else { cat.x=lerp(cat.x,tgt.x,.2); cat.y=lerp(cat.y,tgt.y+2,.2); }

  // camera
  const tx=clamp(p.x+p.w/2-W/2,0,WORLD.w-W);
  const ty=clamp(p.y+p.h/2-H*0.58,0,WORLD.h-H);
  cam.x=lerp(cam.x,tx,.09); cam.y=lerp(cam.y,ty,.09);

  if(msg){ msg.life--; if(msg.life<=0) msg=null; }
  if(fade>0) fade-=.03;
}

/* ---------- drawing ---------- */
function poly(pts,fill){ ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); }

function ridge(x0,y0,w,h,seed,fill){
  const pts=[[x0,y0+h]]; const n=9;
  for(let i=0;i<=n;i++){
    const s=Math.sin((i+seed)*12.9898)*43758.5453;
    const r=s-Math.floor(s);
    pts.push([x0+w*i/n, y0+h-r*h*0.9-h*0.1]);
  }
  pts.push([x0+w,y0+h]); poly(pts,fill);
}

function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#040a10'); g.addColorStop(.38,'#0d2530');
  g.addColorStop(.66,'#2a5254'); g.addColorStop(1,'#123039');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

function layer(f,fn){ ctx.save(); ctx.translate(-cam.x*f,-cam.y*f); fn(); ctx.restore(); }

function drawSun(){
  layer(.18,()=>{
    const x=760,y=600;
    const g=ctx.createRadialGradient(x,y,10,x,y,420);
    g.addColorStop(0,'rgba(255,214,140,.95)');
    g.addColorStop(.18,'rgba(243,167,86,.55)');
    g.addColorStop(.55,'rgba(226,112,58,.20)');
    g.addColorStop(1,'rgba(226,112,58,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,420,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,228,168,.92)'; ctx.beginPath(); ctx.arc(x,y,108,0,7); ctx.fill();
    // clouds
    ctx.fillStyle='rgba(247,222,178,.16)';
    [[520,520,150,26],[900,470,190,22],[660,430,120,18],[1000,560,150,24]].forEach(c=>{
      ctx.beginPath(); ctx.ellipse(c[0],c[1],c[2],c[3],0,0,7); ctx.fill();
    });
    // birds
    ctx.strokeStyle='rgba(30,40,44,.5)'; ctx.lineWidth=2;
    [[980,380],[1015,362],[1050,384],[1085,358]].forEach(b=>{
      ctx.beginPath(); ctx.moveTo(b[0],b[1]); ctx.quadraticCurveTo(b[0]+8,b[1]-6,b[0]+16,b[1]);
      ctx.stroke();
    });
  });
}

function tower(x,base,scale,fill){
  ctx.save(); ctx.translate(x,base); ctx.scale(scale,scale);
  poly([[-150,0],[-92,-260],[92,-260],[150,0]],fill);       // rock
  poly([[-62,-250],[-62,-430],[62,-430],[62,-250]],fill);   // body
  poly([[-84,-424],[84,-424],[62,-462],[-62,-462]],fill);   // eave
  poly([[-44,-458],[-44,-556],[44,-556],[44,-458]],fill);   // upper
  poly([[-60,-550],[60,-550],[0,-660]],fill);               // roof
  ctx.fillStyle=fill; ctx.fillRect(-3,-720,6,64);           // spire
  ctx.beginPath(); ctx.arc(0,-728,7,0,7); ctx.fill();
  ctx.restore();
}

function windmill(x,base,scale,fill,spin){
  ctx.save(); ctx.translate(x,base); ctx.scale(scale,scale);
  poly([[-46,0],[-26,-190],[26,-190],[46,0]],fill);
  poly([[-36,-186],[36,-186],[0,-238]],fill);
  ctx.translate(0,-200); ctx.rotate(spin);
  ctx.fillStyle=fill;
  for(let i=0;i<4;i++){ ctx.rotate(Math.PI/2);
    ctx.fillRect(-5,-6,124,12); ctx.fillRect(96,-26,22,52); }
  ctx.restore();
}

function coverDraw(img,sx,sy,sw,sh,dx,dy,dw,dh){
  const sAR=sw/sh, dAR=dw/dh;
  let cx=sx,cy=sy,cw=sw,ch=sh;
  if(dAR>sAR){ ch=sw/dAR; cy=sy+(sh-ch)/2; }
  else { cw=sh*dAR; cx=sx+(sw-cw)/2; }
  ctx.drawImage(img,cx,cy,cw,ch,dx,dy,dw,dh);
}
function drawPoster(){
  const iw=POSTER.width, ih=POSTER.height;
  const dw=W+640, dh=H+320;
  const dx=-cam.x*0.18, dy=-cam.y*0.14-60;
  lastP={dx,dy,dw,dh};
  ctx.save();
  ctx.globalAlpha=0.50;
  // crop away the poster's lettering, laurels and review strip
  coverDraw(POSTER,0,ih*0.13,iw,ih*0.42,dx,dy,dw,dh);
  ctx.restore();
  // cool wash so the silhouettes and lantern glow still read on top
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(6,16,24,.62)');
  g.addColorStop(.55,'rgba(8,26,32,.30)');
  g.addColorStop(1,'rgba(4,10,16,.72)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
function titlePoster(){
  ctx.fillStyle='#03070b'; ctx.fillRect(0,0,W,H);
  // ambient fill: the same art blown up behind, blurred and dimmed
  const cs=Math.max(W/POSTER.width,H/POSTER.height)*1.9;
  const cw=POSTER.width*cs, ch=POSTER.height*cs;
  ctx.save();
  ctx.filter='blur(30px)'; ctx.globalAlpha=.42;
  ctx.drawImage(POSTER,(W-cw)/2,(H-ch)/2,cw,ch);
  ctx.restore();
  // the margins stay dark except where the boy's own lantern would be
  // casting light -- same "the light reveals it" rule as the game itself
  const lgx=490+Math.sin(t/70)*8, lgy=428;
  const lv=ctx.createRadialGradient(lgx,lgy,0,lgx,lgy,270);
  lv.addColorStop(0,'rgba(4,10,16,0)');
  lv.addColorStop(.45,'rgba(4,10,16,.55)');
  lv.addColorStop(1,'rgba(4,10,16,.95)');
  ctx.fillStyle=lv; ctx.fillRect(0,0,W,H);
  // a soft warm glow from the lantern itself
  const lw=ctx.createRadialGradient(lgx,lgy,0,lgx,lgy,90);
  lw.addColorStop(0,'rgba(255,214,140,.16)');
  lw.addColorStop(1,'rgba(255,214,140,0)');
  ctx.fillStyle=lw; ctx.fillRect(0,0,W,H);

  // the whole poster, nothing cropped
  const ph=H, pw=ph*POSTER.width/POSTER.height, px=(W-pw)/2;
  ctx.drawImage(POSTER,px,0,pw,ph);
  // soften where it meets the fill
  const le=ctx.createLinearGradient(px,0,px+26,0);
  le.addColorStop(0,'rgba(3,7,11,.55)'); le.addColorStop(1,'rgba(3,7,11,0)');
  ctx.fillStyle=le; ctx.fillRect(px,0,26,H);
  const re=ctx.createLinearGradient(px+pw,0,px+pw-26,0);
  re.addColorStop(0,'rgba(3,7,11,.55)'); re.addColorStop(1,'rgba(3,7,11,0)');
  ctx.fillStyle=re; ctx.fillRect(px+pw-26,0,26,H);

  // caption scrim + instructions
  const g=ctx.createLinearGradient(0,H*0.55,0,H);
  g.addColorStop(0,'rgba(3,7,11,0)');
  g.addColorStop(.45,'rgba(3,7,11,.80)');
  g.addColorStop(1,'rgba(3,7,11,.97)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.textAlign='center';
  ctx.font='13px "Trebuchet MS",sans-serif'; ctx.fillStyle='rgba(246,230,194,.72)';
  ctx.fillText('Arrows or A / D to walk  ·  Space to jump',W/2,438);
  ctx.fillText('Hold Shift to flare the lantern',W/2,456);
  ctx.strokeStyle='rgba(246,230,194,.25)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(W/2-45,470.5); ctx.lineTo(W/2+45,470.5); ctx.stroke();
  ctx.fillText('Stone always holds you. Rune ledges hold',W/2,488);
  ctx.fillText('you only while your light touches them.',W/2,505);
  ctx.fillText('Gather six shards, then reach the beacon.',W/2,522);
  const a=.5+Math.sin(t/22)*.5;
  ctx.letterSpacing='3px';
  ctx.font='700 18px "Trebuchet MS",sans-serif';
  ctx.fillStyle=`rgba(243,180,95,${.45+a*.55})`;
  ctx.fillText('PRESS SPACE TO LIGHT THE LANTERN',W/2,552);
  ctx.letterSpacing='0px';
  ctx.font='12px "Trebuchet MS",sans-serif'; ctx.fillStyle='rgba(246,230,194,.35)';
  ctx.fillText('R restarts  ·  M mutes  ·  B swaps background',W/2,578);
  ctx.restore();
}
function drawBackdrop(){
  layer(.22,()=>{ ridge(-200,300,1500,420,3,'rgba(66,104,102,.55)'); ridge(700,340,1600,420,9,'rgba(56,92,94,.55)'); });
  layer(.30,()=>{ tower(820,760,1.0,'rgba(30,62,66,.85)'); });
  layer(.42,()=>{
    ridge(-300,560,1400,340,17,'rgba(24,54,60,.9)');
    windmill(300,780,.9,'rgba(18,44,50,.95)',t*0.006);
    // dome
    ctx.fillStyle='rgba(18,44,50,.95)';
    ctx.beginPath(); ctx.arc(1240,790,130,Math.PI,0); ctx.fill();
    ctx.fillRect(1110,780,260,60);
    ctx.strokeStyle='rgba(243,180,95,.35)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(1240,720,26,0,7); ctx.stroke();
  });
  layer(.62,()=>{
    // stacked town rooftops
    ctx.fillStyle='rgba(11,30,36,.96)';
    let x=-200;
    for(let i=0;i<26;i++){
      const s=Math.sin(i*7.31)*0.5+0.5;
      const w=70+s*90, h=90+((i*37)%140);
      ctx.fillRect(x,900-h,w,h+200);
      poly([[x-8,900-h],[x+w+8,900-h],[x+w-14,900-h-30],[x+14,900-h-30]],'rgba(11,30,36,.96)');
      // a few warm windows
      if(i%3===0){ ctx.fillStyle='rgba(243,180,95,.30)'; ctx.fillRect(x+w/2-6,900-h+26,12,16);
        ctx.fillStyle='rgba(11,30,36,.96)'; }
      x+=w+16;
    }
  });
}

function drawFoliage(){ // screen-space frame, like the poster's leaves
  ctx.save();
  const sway=Math.sin(t/90)*6;
  const leaf=(x,y,r,a)=>{ ctx.save(); ctx.translate(x,y); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(r*.7,-r*.5,r*1.6,0);
    ctx.quadraticCurveTo(r*.7,r*.5,0,0); ctx.fill(); ctx.restore(); };
  ctx.fillStyle='rgba(3,8,12,.94)';
  // left cluster
  ctx.beginPath(); ctx.moveTo(-10,-10); ctx.lineTo(120,-10);
  ctx.quadraticCurveTo(60,180,90,H+10); ctx.lineTo(-10,H+10); ctx.closePath(); ctx.fill();
  [[110,90,26,.5],[96,180,30,.9],[128,40,22,-.3],[104,300,26,1.3],[86,430,24,.8]]
    .forEach(l=>leaf(l[0]+sway*.4,l[1],l[2],l[3]));
  // right cluster
  ctx.beginPath(); ctx.moveTo(W+10,-10); ctx.lineTo(W-130,-10);
  ctx.quadraticCurveTo(W-60,200,W-96,H+10); ctx.lineTo(W+10,H+10); ctx.closePath(); ctx.fill();
  [[W-112,70,-27,-.6],[W-98,170,-30,-1.0],[W-130,26,-22,.3],[W-106,290,-26,-1.4],[W-90,420,-24,-.8]]
    .forEach(l=>leaf(l[0]-sway*.4,l[1],l[2],l[3]));
  ctx.restore();
}

function drawPlatform(p){
  const x=p.x,y=p.y,w=p.w,h=p.h;
  if(p.kind==='p'){
    ctx.fillStyle='#040a0f'; ctx.fillRect(x,y,w,h+ (h>60?0:34));
    ctx.fillStyle='rgba(66,110,104,.35)'; ctx.fillRect(x,y,w,3);
    // grass tufts
    ctx.strokeStyle='rgba(60,102,96,.5)'; ctx.lineWidth=2;
    for(let i=6;i<w;i+=34){ ctx.beginPath(); ctx.moveTo(x+i,y);

}

function drawCatVec(){
  const x=cat.x, y=cat.y+16;
  ctx.save(); ctx.translate(x,y); ctx.fillStyle='#03080c';
  ctx.beginPath(); ctx.ellipse(0,6,11,10,0,0,7); ctx.fill();     // body
  ctx.beginPath(); ctx.arc(0,-6,7.5,0,7); ctx.fill();            // head
  poly([[-7,-10],[-2,-19],[-1,-9]],'#03080c');                   // ears
  poly([[7,-10],[2,-19],[1,-9]],'#03080c');
  ctx.strokeStyle='#03080c'; ctx.lineWidth=3; ctx.beginPath();
  ctx.moveTo(9,8); ctx.quadraticCurveTo(20,6+Math.sin(t/18)*4,16,-6); ctx.stroke();
  ctx.fillStyle='rgba(243,180,95,.85)';
  ctx.fillRect(-4,-8,2.4,2.4); ctx.fillRect(2,-8,2.4,2.4);
  ctx.restore();
}

function drawPlayerVec(){
  const p=player, x=p.x+p.w/2, y=p.y+p.h;
  ctx.save(); ctx.translate(x,y); ctx.scale(p.face,1);
  ctx.fillStyle='#03080c';
  // legs
  const step=p.ground?Math.sin(p.anim)*5:2;
  ctx.fillRect(-7,-11,5,11); ctx.fillRect(2+step*0.2,-11,5,11);
  // cloak
  poly([[-11,-12],[11,-12],[8,-26],[-9,-26]],'#03080c');
  ctx.beginPath(); ctx.moveTo(-9,-26); ctx.quadraticCurveTo(-19,-14,-13,-4);
  ctx.lineTo(-6,-10); ctx.closePath(); ctx.fill();
  // pattern hint on cloak
  ctx.fillStyle='rgba(243,180,95,.20)'; ctx.fillRect(-6,-20,11,2);
  ctx.fillStyle='#03080c';
  // head + tuft
  ctx.beginPath(); ctx.arc(0,-33,8.4,0,7); ctx.fill();
  poly([[-2,-41],[3,-48],[5,-40]],'#03080c');
  // raised arm holding lantern
  ctx.strokeStyle='#03080c'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(6,-26); ctx.lineTo(15,-36); ctx.stroke();
  ctx.restore();
  lanternGlyph();
}
function lanternGlyph(){
  const f=1+Math.sin(t/9)*.05;
  ctx.save(); ctx.translate(L.x,L.y+3); ctx.scale(f*1.15,f*1.15);
  ctx.strokeStyle='#03080c'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.arc(0,-9,4.6,Math.PI,0); ctx.stroke();
  ctx.fillStyle='#03080c'; ctx.fillRect(-6,-8,12,3); ctx.fillRect(-6,4,12,3);
  ctx.fillRect(-6,-6,2,11); ctx.fillRect(4,-6,2,11);
  ctx.fillStyle='rgba(255,222,158,.95)'; ctx.fillRect(-4,-6,8,11);
  ctx.fillStyle='rgba(255,246,214,.95)'; ctx.fillRect(-1.6,-3,3.2,6);
  ctx.restore();
}
function drawPlayer(){
  if(!boyOK){ drawPlayerVec(); return; }
  const p=player;
  const h=54, w=h*BOY.width/BOY.height;
  const bob=(p.ground&&Math.abs(p.vx)>0.5)?Math.abs(Math.sin(p.anim))*1.7:0;
  const lean=p.ground?0:clamp(p.vy*0.006,-.05,.06)*p.face;
  ctx.save();
  ctx.translate(p.x+p.w/2,p.y+p.h+1-bob);
  ctx.scale(p.face,1); ctx.rotate(lean);
  ctx.drawImage(BOY,-w*0.5,-h,w,h);
  ctx.restore();
  lanternGlyph();
}
function drawCat(){
  if(!catOK){ drawCatVec(); return; }
  const h=29, w=h*CAT.width/CAT.height;
  const tgt=cat.trail.length?cat.trail[0]:null;
  if(tgt&&Math.abs(tgt.x-cat.x)>0.7) cat.face=tgt.x>cat.x?1:-1;
  const moving=tgt&&Math.abs(tgt.x-cat.x)>1.2;
  const bob=moving?Math.abs(Math.sin(t/7))*1.6:Math.sin(t/38)*0.6;
  ctx.save();
  ctx.translate(cat.x+10,cat.y+34-bob); ctx.scale(cat.face,1);
  ctx.drawImage(CAT,-w*0.5,-h,w,h);
  ctx.restore();
}

/* light + dark passes */
const dcv=document.createElement('canvas'); dcv.width=W; dcv.height=H;
const dctx=dcv.getContext('2d');
function darkness(){
  const R=lightRadius();
  dctx.globalCompositeOperation='source-over';
  dctx.clearRect(0,0,W,H);
  dctx.fillStyle='rgba(3,8,14,.90)'; dctx.fillRect(0,0,W,H);
  dctx.globalCompositeOperation='destination-out';
  const hole=(sx,sy,r,strength=1)=>{
    const g=dctx.createRadialGradient(sx,sy,0,sx,sy,r);
    g.addColorStop(0,`rgba(0,0,0,${strength})`);
    g.addColorStop(.55,`rgba(0,0,0,${strength*.62})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    dctx.fillStyle=g; dctx.beginPath(); dctx.arc(sx,sy,r,0,7); dctx.fill();
  };
  let sx=760-cam.x*.18, sy=600-cam.y*.18, sr=520, ss=.72;
  if(bgMode&&posterOK&&lastP){ sx=lastP.dx+lastP.dw*0.50; sy=lastP.dy+lastP.dh*0.42; sr=430; ss=.55; }
  hole(sx,sy,sr,ss);
  if(state==='play'){
    const fl=Math.sin(t/7)*3+Math.sin(t/3.1)*1.5;
    hole(L.x-cam.x,L.y-cam.y,R+fl,1);
    for(const l of lamps) if(l.lit) hole(l.x-cam.x,l.y-46-cam.y,168,.92);
    for(const s of shards) if(!s.got) hole(s.x-cam.x,s.y-cam.y,46,.55);
    for(const f of flies) if(f.on) hole(f.x-cam.x,f.y-cam.y,34,.5);
    hole(BEACON.x-cam.x,BEACON.y-46-cam.y,150,.8);
  }
  dctx.globalCompositeOperation='source-over';
  ctx.drawImage(dcv,0,0);
}
function glowPass(){
  ctx.save(); ctx.globalCompositeOperation='lighter';
  const add=(sx,sy,r,col)=>{ const g=ctx.createRadialGradient(sx,sy,0,sx,sy,r);
    g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,sy,r,0,7); ctx.fill(); };
  if(state==='play'){
    const R=lightRadius();
    add(L.x-cam.x,L.y-cam.y,R*.92,'rgba(243,167,86,.30)');
    add(L.x-cam.x,L.y-cam.y,26,'rgba(255,226,168,.42)');
    for(const l of lamps) if(l.lit) add(l.x-cam.x,l.y-46-cam.y,110,'rgba(243,167,86,.26)');
    for(const s of shards) if(!s.got) add(s.x-cam.x,s.y-cam.y,40,'rgba(170,220,255,.34)');
    for(const f of flies) if(f.on) add(f.x-cam.x,f.y-cam.y,26,'rgba(255,214,140,.4)');
    add(BEACON.x-cam.x,BEACON.y-46-cam.y,130,'rgba(255,214,140,.34)');
  }
  ctx.restore();
  // vignette
  const v=ctx.createRadialGradient(W/2,H/2,H*.42,W/2,H/2,H*1.05);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.72)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
}

/* motes */
const motes=[...Array(70)].map(()=>({x:Math.random()*WORLD.w,y:Math.random()*WORLD.h,
  s:.3+Math.random()*.8,ph:Math.random()*6}));
function drawMotes(){
  for(const m of motes){
    const sx=m.x-cam.x*.9, sy=m.y-cam.y*.9+Math.sin(t/60+m.ph)*12;
    if(sx<-20||sx>W+20||sy<-20||sy>H+20) continue;
    ctx.fillStyle=`rgba(246,230,194,${.10+Math.sin(t/40+m.ph)*.06})`;
    ctx.beginPath(); ctx.arc(sx,sy,m.s*1.6,0,7); ctx.fill();
  }
}

/* HUD */
function hud(){
  ctx.save();
  ctx.font='700 13px "Trebuchet MS",sans-serif'; ctx.textAlign='left';
  // oil
  ctx.fillStyle='rgba(246,230,194,.55)'; ctx.fillText('LANTERN OIL',150,44);
  ctx.strokeStyle='rgba(246,230,194,.35)'; ctx.lineWidth=1.5;
  ctx.strokeRect(150,52,168,9);
  const g=ctx.createLinearGradient(150,0,318,0);
  g.addColorStop(0,'#e2703a'); g.addColorStop(1,'#f7d089');
  ctx.fillStyle=g; ctx.fillRect(151.5,53.5,165*(L.oil/100),6);
  // shards
  ctx.textAlign='right';
  ctx.fillStyle='rgba(246,230,194,.55)'; ctx.fillText('LIGHT SHARDS',W-150,44);
  for(let i=0;i<6;i++){
    const x=W-150-i*22, y=57, got=shards.filter(s=>s.got).length>i;
    ctx.beginPath(); ctx.moveTo(x,y-8); ctx.lineTo(x+7,y); ctx.lineTo(x,y+8); ctx.lineTo(x-7,y);
    ctx.closePath();
    ctx.fillStyle=got?'rgba(206,236,255,.95)':'rgba(246,230,194,.14)'; ctx.fill();
    ctx.strokeStyle='rgba(246,230,194,.3)'; ctx.stroke();
  }
  // timer
  ctx.textAlign='center'; ctx.fillStyle='rgba(246,230,194,.4)';
  ctx.fillText(fmt(timer),W/2,44);
  // message
  if(msg){
    const a=clamp(msg.life/60,0,1);
    ctx.textAlign='center'; ctx.font='700 15px "Trebuchet MS",sans-serif';
    ctx.fillStyle=`rgba(246,230,194,${.8*a})`;
    ctx.fillText(msg.text,W/2,H-52);
  }
  ctx.restore();
}
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;

function titleScreen(){
  ctx.save(); ctx.textAlign='center';
  ctx.fillStyle='rgba(5,11,17,.5)'; ctx.fillRect(0,0,W,H);
  ctx.font='700 76px "Trebuchet MS",sans-serif';
  ctx.fillStyle=C.cream; ctx.letterSpacing='14px';
  ctx.fillText('ILLUMINATION',W/2,220);
  ctx.letterSpacing='4px';
  ctx.font='700 17px "Trebuchet MS",sans-serif'; ctx.fillStyle='rgba(246,230,194,.72)';
  ctx.fillText('A 2D ADVENTURE OF LIGHT AND DISCOVERY',W/2,258);
  ctx.letterSpacing='0px';
  ctx.font='15px "Trebuchet MS",sans-serif'; ctx.fillStyle='rgba(246,230,194,.62)';
  ctx.fillText('Arrows or A / D to walk  ·  Space to jump  ·  Hold Shift to flare the lantern',W/2,340);
  ctx.fillText('Stone holds you always. Rune ledges hold you only while your light touches them.',W/2,366);
  ctx.fillText('Reach the beacon at the tower. Gather six shards on the way.',W/2,392);
  const a=.5+Math.sin(t/22)*.5;
  ctx.font='700 18px "Trebuchet MS",sans-serif'; ctx.fillStyle=`rgba(243,180,95,${.45+a*.55})`;
  ctx.fillText('PRESS SPACE TO LIGHT THE LANTERN',W/2,470);
  ctx.font='13px "Trebuchet MS",sans-serif'; ctx.fillStyle='rgba(246,230,194,.35)';
  ctx.fillText('R restarts  ·  M mutes  ·  B swaps the background',W/2,520);
  ctx.restore();
}

function winScreen(){
  ctx.save(); ctx.textAlign='center';
  ctx.fillStyle='rgba(5,11,17,.72)'; ctx.fillRect(0,0,W,H);
  const n=shards.filter(s=>s.got).length;
  ctx.letterSpacing='10px'; ctx.font='700 54px "Trebuchet MS",sans-serif';
  ctx.fillStyle=C.cream; ctx.fillText(n===6?'SEE BEYOND':'THE BEACON BURNS',W/2,230);
  ctx.letterSpacing='0px';
  ctx.font='16px "Trebuchet MS",sans-serif'; ctx.fillStyle='rgba(246,230,194,.75)';
  ctx.fillText(n===6
    ? 'Every shard found. The whole valley wakes up beneath you.'
    : 'You reached the tower — but some shards are still out there in the dark.',W/2,282);
  ctx.font='700 20px "Trebuchet MS",sans-serif'; ctx.fillStyle=C.amber;
  ctx.fillText(`${n} / 6 shards  ·  ${fmt(timer)}`,W/2,340);
  const a=.5+Math.sin(t/22)*.5;
  ctx.font='700 16px "Trebuchet MS",sans-serif'; ctx.fillStyle=`rgba(246,230,194,${.4+a*.5})`;
  ctx.fillText('PRESS SPACE TO WALK IT AGAIN',W/2,420);
  ctx.restore();
}

function render(){
  if(state==='title'&&posterOK){ titlePoster(); return; }
  drawSky();
  if(bgMode&&posterOK){ drawPoster(); }
  else { drawSun(); drawBackdrop(); }

  ctx.save(); ctx.translate(-cam.x,-cam.y);
  for(const p of plats) drawPlatform(p);
  drawSign(560,1800,'LIGHT\nTHE WAY','✧');
  drawSign(1000,1740,'SEE\nBEYOND','◉');
  for(const l of lamps) drawLamp(l);
  for(const s of shards) drawShard(s);
  for(const f of flies) drawFly(f);
  drawBeacon();
  ctx.restore();

  drawMotes();
  darkness();
  glowPass();
  if(state==='play'){
    ctx.save(); ctx.translate(-cam.x,-cam.y);
    if(player.dead===0) drawPlayer();
    drawCat();
    ctx.restore();
  }
  drawFoliage();

  if(state==='play'){ hud(); if(fade>0){ ctx.fillStyle=`rgba(3,8,14,${fade})`; ctx.fillRect(0,0,W,H); } }
  if(state==='title') titleScreen();
  if(state==='win') winScreen();
}

reset();
(function loop(){ update(); render(); requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
